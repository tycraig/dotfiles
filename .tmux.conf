# ==================================================
# General Settings & Latency
# ==================================================
# Change prefix from Ctrl+b to Ctrl+a (easier on the hands)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Set default shell dynamically from environment
set -g default-shell "${SHELL}"

# Eliminate escape-key delay for instant Vim mode switching
set -s escape-time 0

# Enable modern extended keys (Kitty keyboard protocol for Neovim)
set -g extended-keys on

# Window constraints adjust per active window view rather than session
set -gw aggressive-resize on

# Keep status messages visible longer (2000ms instead of 750ms)
set -g display-time 2000

# Increase history limit
set -g history-limit 50000

# Enable full mouse control (click panes, resize, scroll)
set -g mouse on

# Pass terminal focus events through to Neovim
set -g focus-events on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Don't automatically rename windows
set -g allow-rename off

# Forward terminal window titles to outer terminal
set-option -g set-titles on
set-option -g set-titles-string '#T'

# ==================================================
# Terminal Colors & OSC 52 Clipboard
# ==================================================
# Set true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Enable OSC 52 clipboard passthrough to outer terminal (WezTerm)
set -s set-clipboard on

# ==================================================
# Keybindings 
# ==================================================
# Quick config reload
bind r source-file ~/.tmux.conf \; display "tmux config reloaded!"

# Split panes using | and - in the current working directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navigate panes using Vim movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate panes quickly using Meta + direction key
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ==================================================
# Vi Copy Mode & Yanking
# ==================================================
setw -g mode-keys vi

# Use v to select, y to copy (copies via OSC 52 automatically)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ==================================================
# Tokyo Night Styling & Status Bar
# ==================================================
# Mode & Message styling
set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Status Bar
set -g status-position bottom
set -g status-style "bg=#1f2335,fg=#c0caf5"

set -g status-left-length 40
set -g status-left "#[fg=#1f2335,bg=#7aa2f7,bold] #S #[bg=default] "

set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#1f2335,bg=#bb9af7,bold] #I:#W #[bg=default]"

set -g status-right-length 80
set -g status-right "#[fg=#7dcfff]#{pane_current_path} #[fg=#565f89]| #[fg=#9ece6a]%H:%M "
