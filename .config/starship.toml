command_timeout = 500

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$package\
$c\
$cmake\
$rust\
$golang\
$nodejs\
$python\
$java\
$kotlin\
$ruby\
$php\
$dotnet\
$zig\
$lua\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ==================================================
# Identity & Machine
# ==================================================
[os]
disabled = false
style = "bold #7aa2f7"
format = "[$symbol]($style)"

[username]
show_always = false
style_user = "bold #bb9af7"
style_root = "bold #f7768e"
format = " [ $user]($style)"

[hostname]
ssh_only = true
style = "bold #7aa2f7"
format = "[@󰒋 $hostname]($style) "

# ==================================================
# Directory & Path
# ==================================================
[directory]
style = "bold #7dcfff"
format = " [ $path]($style) "
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bold #f7768e"

# ==================================================
# Git Integration
# ==================================================
[git_branch]
symbol = " "
style = "bold #bb9af7"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #f7768e"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "󰹹 ⇡${ahead_count} ⇣${behind_count} "
untracked = "${count} "
stashed = "📦 "
modified = " ${count} "
staged = "󰐗 ${count} "
renamed = "󰑕 ${count} "
deleted = "󰆴 ${count} "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold #e0af68"

# ==================================================
# Runtime & Language Symbols
# ==================================================
[c]
symbol = " "
style = "bold #7aa2f7"
format = "[$symbol($version )]($style)"

[cmake]
symbol = " "
style = "bold #7aa2f7"
format = "[$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold #ff9e64"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #7dcfff"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold #9ece6a"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #ff9e64"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "bold #f7768e"
format = "[$symbol($version )]($style)"

[kotlin]
symbol = " "
style = "bold #bb9af7"
format = "[$symbol($version )]($style)"

[ruby]
symbol = " "
style = "bold #f7768e"
format = "[$symbol($version )]($style)"

[php]
symbol = " "
style = "bold #7aa2f7"
format = "[$symbol($version )]($style)"

[dotnet]
symbol = "󰌛 "
style = "bold #bb9af7"
format = "[$symbol($version )]($style)"

[zig]
symbol = " "
style = "bold #ff9e64"
format = "[$symbol($version )]($style)"

[lua]
symbol = " "
style = "bold #7aa2f7"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold #7dcfff"
format = "[$symbol$context]($style) "

[package]
symbol = "󰏗 "
style = "bold #9ece6a"
format = "[$symbol$version]($style) "

# ==================================================
# OS Symbols
# ==================================================
[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# ==================================================
# Command Runtime & Prompts
# ==================================================
[cmd_duration]
min_time = 2_000
style = "bold #e0af68"
format = "took [󱫣 $duration]($style) "

[character]
success_symbol = "[❯](bold #9ece6a) "
error_symbol = "[❯](bold #f7768e) "
vimcmd_symbol = "[❮](bold #e0af68) "
vimcmd_visual_symbol = "[❮](bold #bb9af7) "
vimcmd_replace_symbol = "[❮](bold #f7768e) "
